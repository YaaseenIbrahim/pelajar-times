<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>PELAJAR TIMES</title>

		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

		<link
			href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap"
			rel="stylesheet"
		/>
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<link
			href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap"
			rel="stylesheet"
		/>
		<link rel="stylesheet" href="styles.css" />
		<link rel="stylesheet" href="css/hero.css" />
		<link rel="stylesheet" href="css/news.css" />
	</head>

	<body>
		<section class="hero">
			<div class="background-photo"></div>

			<div class="background-overlay"></div>

			<div id="memory-wall"></div>

			<div class="masthead">
				<div class="edition">
					<span>VOL. 01</span>
					<span>MALAYSIA EDITION</span>
					<span>SINCE 2026</span>
				</div>

				<h1>
					PELAJAR
					<span>TIMES</span>
				</h1>

				<p>
					The unofficial archive of Maldivian students in Malaysia.
					Every memory has a headline.
				</p>

				<div class="scroll-indicator">
					<div class="line"></div>
					<span>SCROLL</span>
				</div>
			</div>
		</section>

		<main>
			<section class="quotes-preview">
				<div class="quotes-container">
					<p class="quotes-label">QUOTE OF THE DAY</p>

					<blockquote
						class="quote-text"
						id="daily-quote"
					></blockquote>

					<p class="author-text" id="daily-author"></p>

					<a href="quotes.html" class="quotes-button">
						Browse the Pelajar Quotes →
					</a>
				</div>
			</section>

			<section class="news-title">
				<div class="news-container">
					<h2>NEWS</h2>
					<p>THE LATEST AND GREATEST CURRENT AFFAIRS</p>
				</div>
			</section>

			<section class="news-grid-section">
				<div class="news-grid" id="news-grid"></div>
			</section>
		</main>

		<script src="js/hero.js"></script>
		<script type="module" src="js/home.js"></script>
		<script src="js/quoteoftheday.js"></script>
	</body>
</html>
