<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />

		<title>Article Title</title>

		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

		<link
			href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Manrope:wght@600;700;800&display=swap"
			rel="stylesheet"
		/>

		<link rel="stylesheet" href="css/article.css" />
		<link rel="stylesheet" href="styles.css" />
	</head>

	<body>
		<header class="topbar">
			<a href="index.html" class="back-button"> ← Back </a>
			<a href="index.html" class="logo">PELAJAR TIMES</a>
		</header>

		<main class="article article-loading">
			<section class="article-hero" aria-labelledby="article-title">
				<div class="hero-image">
					<img id="article-image" src="" alt="" />
				</div>

				<div class="article-header">
					<h1 id="article-title"></h1>
					<div class="meta" id="article-date"></div>
				</div>
			</section>

			<article class="article-body" id="article-body"></article>

			<section class="media-gallery" id="article-media"></section>

			<nav class="article-navigation" id="article-navigation"></nav>
		</main>
		<!-- IMAGE LIGHTBOX -->
		<div id="image-lightbox" class="image-lightbox hidden">
			<button
				id="lightbox-close"
				class="lightbox-close"
				aria-label="Close image"
			>
				X
			</button>

			<img id="lightbox-image" src="" alt="" />
		</div>
		<script type="module" src="js/article.js"></script>
	</body>
</html>
